{% extends 'core/base.html' %}
{% load static %} {% block content %}
<style>
    /* Estilos para garantir o alinhamento dos critérios */
    .form-group {
        margin-bottom: 20px;
    }
    .criterion-group {
        margin-bottom: 25px;
        text-align: center; /* Centraliza o conteúdo do grupo */
    }
    .criterion-group p { /* Estilo para o título do critério adicionado */
        margin-bottom: 5px;
        font-size: 1.1em;
    }
    .criterion-group label {
        display: block;
        margin-bottom: 10px; /* Aumenta o espaço entre a pergunta e a caixa */
        font-weight: normal;
        line-height: 1.5;
        text-align: left; /* Mantém o texto da pergunta alinhado à esquerda */
    }

    /* AQUI ESTÁ A MUDANÇA PRINCIPAL */
    .criterion-group input {
        display: block;
        width: 100px;  /* Largura bem menor para a caixa de nota */
        margin: 0 auto; /* Centraliza a caixa de texto horizontalmente */
        text-align: center; /* Centraliza o número digitado dentro da caixa */
    }
    
    .form-title {
        text-align: center;
        margin-bottom: 30px;
    }
    .submit-button-wrapper {
        text-align: center; /* Centraliza o botão de envio */
        margin-top: 30px;
    }
</style>

<h2 class="form-title">Formulário de Votação</h2>

{% if messages %}
  <div class="messages" style="list-style: none; padding: 0; text-align: center;">
    {% for message in messages %}
      <div class="alert alert-success" role="alert" style="background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; border-radius: 5px; margin-bottom: 25px; padding: 15px;">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
<form method="post">
    {% csrf_token %}

    <div class="form-group">
        <label for="jurado" style="font-weight: bold;">Nome do Avaliador:</label>
        <input type="text" id="jurado" name="jurado" required>
    </div>

    <div class="form-group">
        <label for="escuderia" style="font-weight: bold;">Escuderia Avaliada:</label>
        <select id="escuderia" name="escuderia" required>
            <option value="">---------</option>
            {% for escuderia in escuderias %}
                <option value="{{ escuderia.id }}">{{ escuderia.nome }}</option>
            {% endfor %}
        </select>
    </div>
    
    <h3 class="form-title" style="margin-top: 40px;">Critérios Avaliativos</h3>

    <div class="criterion-group">
        <label for="aderencia">Aderência ao Tema (Nota de 0 a 10)</label>
        <input type="number" id="aderencia" name="aderencia" min="0" max="10" required>
    </div>

    <div class="criterion-group">
        <label for="criatividade">Criatividade (Nota de 0 a 10)</label>
        <input type="number" id="criatividade" name="criatividade" min="0" max="10" required>
    </div>

    <div class="criterion-group">
        <label for="inovacao">Inovação (Nota de 0 a 10)</label>
        <input type="number" id="inovacao" name="inovacao" min="0" max="10" required>
    </div>

    <div class="criterion-group">
        <label for="atratividade">Atratividade (Nota de 0 a 10)</label>
        <input type="number" id="atratividade" name="atratividade" min="0" max="10" required>
    </div>

    <div class="criterion-group">
        <label for="canvas">Qualidade do Canvas (Nota de 0 a 10)</label>
        <input type="number" id="canvas" name="canvas" min="0" max="10" required>
    </div>

    <div class="criterion-group">
        <label for="prototipo">Qualidade do Protótipo (Nota de 0 a 10)</label>
        <input type="number" id="prototipo" name="prototipo" min="0" max="10" required>
    </div>

    <div class="criterion-group">
        <label for="pitch">Qualidade do Pitch (Nota de 0 a 10)</label>
        <input type="number" id="pitch" name="pitch" min="0" max="10" required>
    </div>
    
    <div class="submit-button-wrapper">
        <button type="submit">Enviar Voto</button>
    </div>

</form>
{% endblock %}
